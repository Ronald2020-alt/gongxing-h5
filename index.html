<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>躬行先锋 · 海报生成</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ma-shan-zheng@5/index.css">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<div class="app">
  <!-- ===== 左侧：编辑面板 ===== -->
  <aside class="panel">
    <header class="panel-header">
      <div class="brand-mark">躬</div>
      <div>
        <h1>躬行先锋</h1>
        <p>一线文化践行瞬间 · 海报生成器</p>
      </div>
    </header>

    <div class="panel-scroll">
      <!-- ① 照片 -->
      <section class="field-group">
        <label class="field-label">① 人物照片 <span>单张竖版 · 单人/双人</span></label>
        <label class="photo-upload" id="photoUpload">
          <input type="file" id="photoInput" accept="image/*">
          <span class="upload-plus">＋</span>
          <span class="upload-text">上传照片</span>
        </label>
        <div class="photo-tip" id="photoTip">上传后可点「调整构图」微调</div>
      </section>

      <!-- ② 节点 -->
      <section class="field-group">
        <label class="field-label">② 节点 / 节日</label>
        <select id="nodeSelect" class="input"></select>
        <div class="node-custom" id="nodeCustom" hidden>
          <input class="input" id="tributeLine1" placeholder="致敬语第一行，如：致敬每一位">
          <input class="input" id="tributeLine2" placeholder="致敬语第二行，如：辛勤付出的零售劳动者">
          <input class="input" id="tributeEn" placeholder="英文点缀，如：Dragon Boat Festival（可空）">
        </div>
      </section>

      <!-- ③ 主KV -->
      <section class="field-group">
        <label class="field-label">③ 主标题（主KV）</label>
        <div class="seg" id="kvModeSeg">
          <button class="seg-btn active" data-mode="text">文字</button>
          <button class="seg-btn" data-mode="ip">IP 形象</button>
        </div>

        <div id="kvTextMode" class="mt">
          <input class="input" id="kvText" placeholder="主标题文字" value="躬行先锋">
          <select id="kvFont" class="input mt">
            <option value="msz">书法 · 马善政楷书</option>
            <option value="hei">黑体 · 粗壮</option>
            <option value="song">宋体 · 典雅</option>
            <option value="kai">楷体 · 传统</option>
          </select>
        </div>

        <div id="kvIpMode" class="mt" hidden>
          <div class="ip-grid" id="ipGrid"></div>
          <label class="upload-line">
            <input type="file" id="ipUpload" accept="image/png,image/svg+xml">
            <span>＋ 上传自定义 IP 形象（PNG 透明底）</span>
          </label>
        </div>
      </section>

      <!-- ④ 主文案 -->
      <section class="field-group">
        <label class="field-label">④ 文艺主文案 <span>上价值的那句话</span></label>
        <textarea class="input textarea" id="quote" rows="3" placeholder="例：一座商业空间的温度&#10;来自每一个认真工作的身影"></textarea>
      </section>

      <!-- ⑤ 人物信息 -->
      <section class="field-group">
        <label class="field-label">⑤ 人物信息</label>
        <div class="grid-2">
          <input class="input" id="shop" placeholder="门店，如：武汉门店">
          <input class="input" id="dept" placeholder="部门/岗位，如：运营">
        </div>
        <input class="input mt" id="name" placeholder="姓名，如：文思图">
        <input class="input mt" id="scene" placeholder="画面主要内容，如：客流高峰期间协助店铺快速收银">
      </section>

      <!-- ⑥ logo -->
      <section class="field-group">
        <label class="field-label">⑥ 企业 Logo <span>右上角</span></label>
        <div class="upload-row">
          <label class="upload-box" id="logoUpload">
            <input type="file" id="logoInput" accept="image/*">
            <span>上传 Logo</span>
          </label>
          <button class="btn-ghost2" id="logoReset" type="button">恢复默认</button>
        </div>
        <div class="range-row">
          <span>大小</span>
          <input type="range" id="logoScale" min="0.5" max="2.5" step="0.05" value="1">
        </div>
      </section>

      <!-- ⑦ 二维码 -->
      <section class="field-group">
        <label class="field-label">⑦ 二维码 <span>底部</span></label>
        <div class="upload-row">
          <label class="upload-box" id="qrUpload">
            <input type="file" id="qrInput" accept="image/*">
            <span>上传二维码</span>
          </label>
          <button class="btn-ghost2" id="qrReset" type="button">恢复默认</button>
        </div>
        <div class="range-row">
          <span>大小</span>
          <input type="range" id="qrScale" min="0.5" max="2" step="0.05" value="1">
        </div>
        <input class="input mt" id="qrLabel" maxlength="12" placeholder="二维码说明文字" value="扫码了解更多">
      </section>

      <!-- ⑧ 海报比例 -->
      <section class="field-group">
        <label class="field-label">⑧ 海报比例</label>
        <div class="seg" id="ratioSeg">
          <button class="seg-btn active" data-ratio="9:19.5">9:19.5 全屏</button>
          <button class="seg-btn" data-ratio="9:16">9:16 渐变</button>
        </div>
      </section>

      <!-- ⑨ 版式 -->
      <section class="field-group">
        <label class="field-label">⑨ 选择版式</label>
        <div class="tpl-grid" id="tplGrid"></div>
      </section>

      <button class="btn-primary" id="btnDownload">⬇ 生成并下载海报</button>
      <p class="foot-note">所有数据仅在本地浏览器处理，不会上传</p>
    </div>
  </aside>

  <!-- ===== 右侧：预览 ===== -->
  <main class="preview-area">
    <div class="preview-toolbar">
      <span class="toolbar-title">海报预览</span>
      <button class="btn-ghost" id="btnAdjust">✂ 调整构图</button>
      <button class="btn-ghost" id="btnReset">↺ 自动裁切</button>
    </div>
    <div class="preview-stage" id="previewStage">
      <div class="poster-wrap" id="posterWrap">
        <!-- ============ 海报画布 ============ -->
        <div class="poster" id="poster" data-template="1">
          <img class="p-photo" id="pPhoto" alt="">
          <div class="p-grad-top"></div>
          <div class="p-grad-bottom"></div>
          <div class="p-vignette"></div>

          <!-- 顶部 -->
          <div class="p-top">
            <div class="p-tribute">
              <div class="p-tribute-line" id="pTributeLine1"></div>
              <div class="p-tribute-line" id="pTributeLine2"></div>
              <div class="p-tribute-en" id="pTributeEn"></div>
            </div>
            <img class="p-logo" id="pLogo" src="./assets/logo_default.png" alt="">
          </div>

          <!-- 中部 -->
          <div class="p-mid">
            <div class="p-quote-mark">“</div>
            <div class="p-quote" id="pQuote"></div>
            <div class="p-person" id="pPerson"></div>
          </div>

          <!-- 底部 -->
          <div class="p-bottom">
            <div class="p-kv">
              <div class="p-kv-text-wrap" id="pKvTextWrap">
                <span class="p-kv-dot left"></span>
                <span class="p-kv-text" id="pKvText">躬行先锋</span>
                <span class="p-kv-dot right"></span>
              </div>
              <img class="p-kv-ip" id="pKvIp" src="./assets/ip/ip1.png" alt="" hidden>
            </div>
            <div class="p-slogan">— 全维一流的奥莱引领者 —</div>
            <div class="p-qr">
              <img class="p-qr-img" id="pQrImg" src="./assets/qrcode_default.png" alt="">
              <div class="p-qr-label" id="pQrLabel">扫码了解更多</div>
            </div>
            <div class="p-cities" id="pCities"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="adjust-hint" id="adjustHint" hidden>拖动照片调整位置 · 双指/滚轮缩放 · 完成后点「完成」</div>
  </main>
</div>

<script src="./assets/html-to-image.js"></script>
<script src="./script.js"></script>
</body>
</html>
